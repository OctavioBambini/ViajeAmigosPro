    header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 26px;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{display:grid;place-items:center;width:43px;height:43px;flex:none;border-radius:14px;background:linear-gradient(145deg,var(--accent),#24b4d7);color:#042837;font-weight:900;font-size:23px;box-shadow:0 9px 22px #22dec22b}.brand-name{font-size:15px;font-weight:850;letter-spacing:.4px;white-space:nowrap}.brand-name em{color:var(--accent);font-style:normal}.brand-sub{font-size:11px;color:var(--muted)}.header-right{display:flex;gap:9px;align-items:center}.pill{border:1px solid #337365;background:#143934;color:#77f1d8;border-radius:100px;padding:6px 11px;font-size:11px;font-weight:700;white-space:nowrap}.icon-btn{border:1px solid var(--line);background:#18283a;color:#e9f4ff;border-radius:13px;padding:8px 12px;font-weight:700;min-height:39px}
    .desktop-nav{display:flex;gap:6px;align-items:center;background:#122238c9;border:1px solid #263a50;padding:7px;border-radius:17px;width:max-content;margin-bottom:25px}.nav-item{border:0;background:transparent;color:#a9bfd3;border-radius:11px;padding:10px 18px;display:flex;align-items:center;gap:9px;font-weight:650}.nav-item.active{background:#284257;color:#5deed6}.nav-item svg{width:18px;height:18px}
    .mobile-nav{display:none}.view{animation:appear .22s ease}@keyframes appear{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(29px,4.6vw,48px);line-height:1.1;letter-spacing:-1.8px;margin-bottom:15px}h2{font-size:23px;line-height:1.2;letter-spacing:-.6px;margin-bottom:7px}h3{font-size:17px;letter-spacing:-.25px;margin-bottom:6px}p{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--accent);font-size:11px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:28px 0 15px}.section-head p{margin:0;font-size:13px}
    .hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr);gap:22px;background:linear-gradient(125deg,#132c41,#132638 48%,#123b3d);border:1px solid #284658;border-radius:28px;padding:clamp(22px,5vw,42px);position:relative;overflow:hidden;min-height:310px}.hero:after{content:'✦';position:absolute;right:-36px;top:-125px;font-size:400px;color:#52ebc010;line-height:1}.hero .lead{font-size:15px;max-width:450px;line-height:1.6;margin-bottom:26px}.hero-action{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hero-illustration{display:flex;align-items:center;justify-content:center;position:relative;isolation:isolate}.orbit{width:214px;height:214px;border-radius:50%;border:1px dashed #5be8da70;display:grid;place-items:center;transform:rotate(-12deg);box-shadow:0 0 0 28px #54eace09,0 0 0 56px #54eace05}.pin-art{font-size:90px;filter:drop-shadow(0 12px 24px #31e1ba4a);transform:rotate(12deg)}.floating{position:absolute;background:#192f41e8;border:1px solid #467788;border-radius:13px;padding:9px 12px;font-size:12px;box-shadow:0 12px 24px #0a122455}.float1{right:8px;top:35px}.float2{left:4px;bottom:40px}
    .btn{border:1px solid transparent;padding:12px 17px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}.btn.primary{background:var(--accent);color:#062d36}.btn.secondary{background:#26394a;color:#ebf6fb;border-color:#30485c}.btn.ghost{background:transparent;border-color:#3b6070;color:#ccf5ef}.btn.danger{color:#ffd6da;background:#4b2835;border-color:#704254}.btn.small-btn{padding:7px 11px;min-height:36px;font-size:12px}.btn.full{width:100%}.btn svg{width:18px;height:18px}
    .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:19px 0}.metric{border-radius:17px;padding:17px 19px;background:var(--panel);border:1px solid var(--line)}.metric strong{display:block;font-size:28px;line-height:1.1;color:#fff}.metric span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.metric .symbol{font-size:19px;color:var(--accent);float:right;opacity:.9}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:21px;min-width:0}.card.soft{background:linear-gradient(145deg,#142b40,#121f31)}.card.clickable{cursor:pointer;transition:transform .15s,border-color .15s}.card.clickable:hover{transform:translateY(-2px);border-color:#47aaab}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.square{background:#1a4249;border:1px solid #286663;border-radius:13px;width:46px;height:46px;display:grid;place-items:center;font-size:23px}.card p{font-size:13px;line-height:1.65;margin-bottom:0}.card .arrow{margin-top:18px;color:var(--accent);font-weight:700;font-size:12px}.list{display:grid;gap:11px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 17px}.list-row .txt{min-width:0}.list-row strong{display:block;font-size:14px;overflow-wrap:anywhere}.list-row small{color:var(--muted);display:block;font-size:12px;margin-top:3px;overflow-wrap:anywhere}.list-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}.round-icon{width:40px;height:40px;border-radius:12px;background:#1c3a46;color:#59e4d2;display:grid;place-items:center;font-weight:850;font-size:16px;flex-shrink:0}.head-flex{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 20px}.head-flex p{margin:0;font-size:13px}.empty{padding:36px 16px;text-align:center;border:1px dashed #36556b;border-radius:20px;background:#102134}.empty .big{font-size:32px;margin-bottom:8px}.empty p{margin:5px auto 16px;max-width:380px}
    .trip-current{border:1px solid #318c7a;background:linear-gradient(140deg,#123d42,#16263b);border-radius:20px;padding:22px}.chip{display:inline-block;border-radius:100px;background:#1d4152;color:#68ead5;font-size:11px;padding:5px 10px;font-weight:800;vertical-align:middle}.muted-label{font-size:12px;color:var(--muted)}.tiny-tag{background:#263747;color:#bbd2e7;border:1px solid #3b5367;padding:4px 8px;border-radius:8px;font-size:11px}.subtle-line{height:1px;background:var(--line);margin:16px 0}
    .mapbox{height:360px;position:relative;overflow:hidden;border:1px solid #385267;border-radius:19px;background:#21384c}.mapbox .fallback{height:100%;display:grid;place-content:center;text-align:center;padding:20px;color:#c8e3f2}.mapbox .fallback .big{font-size:45px}.map-legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0;font-size:11px;color:var(--muted)}.map-legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--accent)}.dot.orange{background:#ffa76a}.dot.blue{background:#4caaff}.leaflet-container{background:#1d3246;color:#173343}.leaflet-control-attribution{font-size:10px!important}.map-area .card{margin-top:16px}
    .photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.photo-card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--panel);position:relative}.photo-card img{display:block;width:100%;aspect-ratio:1.25;object-fit:cover}.photo-bar{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.photo-bar span{font-size:12px;color:var(--muted)}.photo-bar .icon-btn{padding:4px 8px;min-height:30px}.photo-large{width:100%;max-height:65vh;object-fit:contain;border-radius:14px}
    dialog{border:1px solid #385467;border-radius:23px;background:#122236;color:var(--text);padding:0;width:min(500px,calc(100vw - 30px));max-height:85dvh;overflow:auto;box-shadow:0 30px 80px #000b}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:21px 22px 12px}.modal-header h2{margin:0;font-size:21px}.modal-body{padding:6px 22px 24px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:750;color:#c6d8e7}.field input,.field textarea,.field select{width:100%;border:1px solid #3b5165;background:#0c1b2c;border-radius:11px;color:var(--text);padding:12px 13px;min-height:44px;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent)}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.modal-buttons .btn{flex:1}.helper{color:#9eb4c8;font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;transition:all .2s;pointer-events:none;background:#dbfff6;color:#073b3c;padding:12px 17px;border-radius:13px;font-weight:750;z-index:2000;max-width:calc(100vw - 30px);box-shadow:0 12px 38px #0007}.toast.show{opacity:1;transform:translate(-50%,0)}.warning{border:1px solid #766447;background:#3c3226;color:#efdcba;border-radius:13px;padding:11px 13px;font-size:12px;line-height:1.6}.footer{text-align:center;font-size:11px;color:#6f88a1;margin:46px 0 20px}.footer strong{color:#a5c0cd}input[type=file]{display:none}
    @media(max-width:780px){.shell{padding:0 16px 104px}.desktop-nav{display:none}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0d1b2df5;border-top:1px solid #2f4559;padding:9px max(7px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));backdrop-filter:blur(16px)}.mobile-nav .nav-item{padding:6px 2px;display:flex;flex-direction:column;gap:2px;border-radius:11px;font-size:10px}.mobile-nav .nav-item svg{width:21px;height:21px}.hero{grid-template-columns:1fr;min-height:unset}.hero-illustration{display:none}.hero{padding:28px}.summary-bar{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.photo-grid{grid-template-columns:repeat(2,1fr)}header{padding:16px 0 23px}.section-head{align-items:center}.section-head .btn{font-size:12px;padding:9px 11px}.mapbox{height:330px}}
    @media(max-width:440px){.brand-mark{width:39px;height:39px}.brand-name{font-size:13px}.pill{font-size:10px;padding:5px 7px}.icon-btn{padding:7px}.grid2,.grid3{grid-template-columns:1fr}.hero h1{font-size:32px}.hero{padding:24px}.head-flex{align-items:flex-start;flex-direction:column}.mapbox{height:300px}.inline-fields{grid-template-columns:1fr 1fr}.summary-bar{gap:9px}.metric{padding:14px}.metric strong{font-size:23px}}

<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="shell">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><div class="brand-name">VIAJEAMIGOS <em>/ PRO</em></div><div class="brand-sub">Tu aventura, mejor organizada.</div></div></div>
      <div class="header-right"><span class="pill">● Modo local</span><button id="dataBtn" class="icon-btn" title="Respaldos y datos" aria-label="Respaldos y datos">⋯</button></div>
    </header>
    <nav id="desktopNav" class="desktop-nav" aria-label="Navegación principal"></nav>
    <main id="app" aria-live="polite"></main>
    <div class="footer"><strong>VIAJEAMIGOS PRO</strong> · Proyecto escolar · Sin Firebase, sin cuentas · Datos locales del navegador</div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-label="Navegación móvil"></nav>
  <input type="file" accept="image/*" capture="environment" id="photoInput">
  <input type="file" accept="application/json,.json" id="importInput">
  <dialog id="modal" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle"></h2><button type="button" class="icon-btn" onclick="closeModal()" aria-label="Cerrar">✕</button></div><div class="modal-body" id="modalBody"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    'use strict';
    const KEY='viajeamigos-pro-web-v1';
    const id=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
    const defaultData=()=>({demo:true,trips:[{id:'demo-1',name:'Escapada a Córdoba',place:'Córdoba, Argentina',start:'2026-12-15',end:'2026-12-18',description:'Un viaje para disfrutar entre amigos.'}],activeTrip:'demo-1',friends:[{id:'f1',tripId:'demo-1',name:'Alex',lat:null,lon:null},{id:'f2',tripId:'demo-1',name:'Sofi',lat:null,lon:null},{id:'f3',tripId:'demo-1',name:'Nico',lat:null,lon:null}],activities:[{id:'e1',tripId:'demo-1',title:'Salida hacia Córdoba',date:'2026-12-15',time:'08:30',place:'Punto de encuentro',notes:'¡Arranca el viaje!'},{id:'e2',tripId:'demo-1',title:'Recorrer el centro',date:'2026-12-15',time:'16:00',place:'Centro de Córdoba',notes:''},{id:'e3',tripId:'demo-1',title:'Día de paseo',date:'2026-12-16',time:'10:00',place:'A definir',notes:''}],places:[{id:'p1',tripId:'demo-1',name:'Córdoba (referencia de ejemplo)',lat:-31.4167,lon:-64.1833}],photos:[]});
    const clean=(raw)=>{
      if(!raw||typeof raw!=='object'||!Array.isArray(raw.trips))throw Error('Archivo no válido');
      for(const k of ['friends','activities','places','photos'])if(!Array.isArray(raw[k]))throw Error('Falta la sección '+k);
      return {demo:!!raw.demo,trips:raw.trips,activeTrip:raw.activeTrip,friends:raw.friends,activities:raw.activities,places:raw.places,photos:raw.photos};
    };
    let data;
    try{const s=localStorage.getItem(KEY);data=s?clean(JSON.parse(s)):defaultData();}catch(e){data=defaultData();}
    let view='home',map=null,userPos=null,toastTimeout=null;
    const $=sel=>document.querySelector(sel);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const trip=()=>data.trips.find(x=>x.id===data.activeTrip)||null;
    const byTrip=(items)=>items.filter(x=>trip()&&x.tripId===trip().id);
    const fmtDate=s=>{if(!s)return 'Sin fecha';const [y,m,d]=s.split('-');return y&&m&&d?`${d}/${m}/${y}`:s;};
    const icon=(name)=>{
      const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',map:'<path d="M3 6 9 3l6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',photo:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5-5L5 21"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',check:'<path d="m5 12 4 4L19 6"/>'};return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.home}</svg>`;
    };
    const navItems=[['home','Inicio','home'],['map','Mapa','map'],['photos','Fotos','photo'],['agenda','Agenda','calendar'],['group','Grupo','users']];
    const nav=()=>{for(const key of ['desktopNav','mobileNav'])$('#'+key).innerHTML=navItems.map(([v,l,i])=>`<button type="button" data-nav="${v}" class="nav-item ${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('');};
    const alertToast=(msg)=>{const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3100);};
    const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){alertToast('Sin espacio para guardar. Eliminá algunas fotos.');return false;}};
    const changePage=p=>{view=p;if(map){map.remove();map=null;}render();window.scrollTo({top:0,behavior:'instant'});};
    const button=(label,fn='none',cls='primary')=>`<button type="button" class="btn ${cls}" data-action="${fn}">${label}</button>`;
    const noneTrip=`<div class="empty"><div class="big">🧳</div><h3>Primero creá un viaje</h3><p>Ahí vas a poder organizar a tus amigos, las actividades y las fotos.</p>${button('Crear viaje','tripNew')}</div>`;
    const sectionHeader=(title,subtitle,right='')=>`<div class="head-flex"><div><div class="eyebrow">VIAJEAMIGOS / PRO</div><h2>${title}</h2><p>${subtitle}</p></div>${right}</div>`;
    const render=()=>{nav();let body='';switch(view){case 'home':body=renderHome();break;case 'map':body=renderMap();break;case 'photos':body=renderPhotos();break;case 'agenda':body=renderAgenda();break;case 'group':body=renderGroup();break;}$('#app').innerHTML=`<div class="view">${body}</div>`;if(view==='map'&&trip())setTimeout(initMap,80);};
    const renderHome=()=>{
      const t=trip(),upcoming=byTrip(data.activities).slice().sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
      return `<section class="hero"><div><div class="eyebrow">✦ PLANIFICÁ · EXPLORÁ · RECORDÁ</div><h1>Tu próxima<br><span style="color:var(--accent)">aventura empieza acá.</span></h1><p class="lead">Todo lo que necesitás para organizar ese viaje con amigos. Sencillo, práctico y desde tu celular.</p><div class="hero-action">${button('Ver mi viaje '+icon('arrow'),'group')}${button('Abrir mapa','map','ghost')}</div></div><div class="hero-illustration" aria-hidden="true"><div class="orbit"><div class="pin-art">📍</div></div><div class="floating float1">✦ Nuevas aventuras</div><div class="floating float2">🗺️ Todo en un lugar</div></div></section>
      ${data.demo?`<div class="warning" style="margin-top:14px">Estás viendo <strong>datos de ejemplo</strong> para presentar la app. Podés crear un viaje real desde <strong>Grupo</strong> y eliminar el ejemplo cuando quieras.</div>`:''}
      <div class="summary-bar"><div class="metric"><span class="symbol">✈</span><strong>${data.trips.length}</strong><span>Viajes creados</span></div><div class="metric"><span class="symbol">♙</span><strong>${byTrip(data.friends).length}</strong><span>Integrantes</span></div><div class="metric"><span class="symbol">▦</span><strong>${byTrip(data.activities).length}</strong><span>Actividades</span></div><div class="metric"><span class="symbol">◈</span><strong>${byTrip(data.photos).length}</strong><span>Recuerdos</span></div></div>
      <div class="section-head"><div><div class="eyebrow">VIAJE ACTUAL</div><h2>${t?esc(t.name):'Todavía no hay un viaje'}</h2><p>${t?esc(t.place||'Destino a definir')+' · '+(t.start?fmtDate(t.start):'Sin fecha'):'Creá un viaje para comenzar'}</p></div>${button('Gestionar','group','secondary')}</div>
      <div class="section-head"><div><h2>Todo a mano</h2><p>Entrá a cualquiera de las secciones.</p></div></div>
      <div class="grid3"><div class="card clickable" data-nav="map"><div class="card-top"><div class="square">🗺️</div>${icon('arrow')}</div><h3>Mapa y lugares</h3><p>Ubicá puntos del viaje y consultá tu propia posición.</p><div class="arrow">Explorar mapa →</div></div><div class="card clickable" data-nav="agenda"><div class="card-top"><div class="square">📆</div>${icon('arrow')}</div><h3>Itinerario</h3><p>Horarios, planes y actividades bien organizados.</p><div class="arrow">Ver agenda →</div></div><div class="card clickable" data-nav="photos"><div class="card-top"><div class="square">📷</div>${icon('arrow')}</div><h3>Recuerdos</h3><p>Sumá fotos y guardá tus momentos favoritos.</p><div class="arrow">Abrir galería →</div></div></div>
      <div class="section-head"><div><h2>Próximas actividades</h2><p>Tu itinerario de un vistazo.</p></div>${button('+ Agregar','eventNew','secondary')}</div>
      ${t&&upcoming.length?`<div class="list">${upcoming.slice(0,3).map(e=>`<div class="list-row"><div class="round-icon">${esc((e.date||'00').slice(-2))}</div><div class="txt" style="flex:1"><strong>${esc(e.title)}</strong><small>${fmtDate(e.date)} · ${esc(e.time||'Sin horario')} · ${esc(e.place||'Lugar a definir')}</small></div>${icon('calendar')}</div>`).join('')}</div>`:(t?'<div class="empty"><div class="big">📆</div><h3>Sin actividades todavía</h3><p>Agregá tu primera actividad para organizar el viaje.</p>'+button('Agregar actividad','eventNew')+'</div>':noneTrip)}`;
    };
    const renderGroup=()=>{
      const t=trip();
      return `${sectionHeader('Tu grupo de viaje','Creá viajes, administrá integrantes y elegí el viaje activo.',button('+ Nuevo viaje','tripNew'))}<div class="grid2"><div class="card"><div class="eyebrow">VIAJE SELECCIONADO</div>${t?`<h2 style="margin-top:12px">${esc(t.name)}</h2><p>📍 ${esc(t.place||'Destino a definir')}</p><p>📅 ${t.start?fmtDate(t.start):'Sin fecha'}${t.end?' — '+fmtDate(t.end):''}</p><p>${esc(t.description||'')}</p><div class="subtle-line"></div><div class="hero-action">${button('Editar','tripEdit','secondary')}${button('Eliminar','tripRemove','danger')}</div>`:noneTrip}</div><div class="card"><div class="eyebrow">MIS VIAJES</div><div class="list" style="margin-top:15px">${data.trips.length?data.trips.map(x=>`<div class="list-row"><div class="txt"><strong>${esc(x.name)} ${t?.id===x.id?'<span class="chip">Activo</span>':''}</strong><small>${esc(x.place||'Destino por definir')}</small></div>${t?.id===x.id?'':`<button class="btn small-btn secondary" data-action="tripSelect" data-id="${esc(x.id)}">Elegir</button>`}</div>`).join(''):'<p>No hay viajes todavía.</p>'}</div></div></div><div class="section-head"><div><h2>Integrantes ${t?'('+byTrip(data.friends).length+')':''}</h2><p>Personas que participan en este viaje.</p></div>${button('+ Integrante','friendNew','secondary')}</div>${t?(byTrip(data.friends).length?`<div class="grid2">${byTrip(data.friends).map(f=>`<div class="list-row"><div class="round-icon">${esc(f.name?.charAt(0).toUpperCase()||'?')}</div><div class="txt" style="flex:1"><strong>${esc(f.name)}</strong><small>${f.lat!=null&&f.lon!=null?'📍 Coordenadas manuales guardadas':'Sin ubicación cargada'}</small></div><div class="list-actions"><button class="btn small-btn secondary" data-action="friendEdit" data-id="${esc(f.id)}" title="Editar integrante">Editar</button><button class="icon-btn" data-action="friendRemove" data-id="${esc(f.id)}" title="Eliminar integrante">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><div class="big">👥</div><h3>Agregá a tus amigos</h3><p>Podés cargar sus nombres y, opcionalmente, coordenadas manuales.</p></div>'):noneTrip}<div class="warning" style="margin-top:18px">Esta versión es <strong>local</strong>: no rastrea ni sincroniza automáticamente las ubicaciones de otras personas. Los integrantes y sus coordenadas se ingresan manualmente.</div>`;
    };
    const renderAgenda=()=>{
      const ev=byTrip(data.activities).slice().sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
      return `${sectionHeader('Agenda de actividades','Organizá cada momento del viaje, con fechas y horarios.',button('+ Actividad','eventNew'))}${trip()?(ev.length?`<div class="list">${ev.map(e=>`<div class="list-row"><div class="round-icon">${esc((e.date||'00').slice(-2))}</div><div class="txt" style="flex:1"><strong>${esc(e.title)}</strong><small>${fmtDate(e.date)} · ${esc(e.time||'Sin horario')}${e.place?' · '+esc(e.place):''}</small>${e.notes?`<small>${esc(e.notes)}</small>`:''}</div><div class="list-actions"><button class="btn small-btn secondary" data-action="eventEdit" data-id="${esc(e.id)}">Editar</button><button class="icon-btn" data-action="eventRemove" data-id="${esc(e.id)}" aria-label="Eliminar actividad">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><div class="big">🗓️</div><h3>Tu aventura está por escribirse</h3><p>Agregá la primera actividad para empezar a planificar.</p>'+button('Crear actividad','eventNew')+'</div>'):noneTrip}`;
    };
    const renderPhotos=()=>{
      const photos=byTrip(data.photos).slice().reverse();
      return `${sectionHeader('Momentos para recordar','Sacá fotos con tu celular o importalas desde la galería.',button('+ Añadir foto','photoNew'))}${trip()?(photos.length?`<div class="photo-grid">${photos.map(p=>`<div class="photo-card"><img alt="${esc(p.name||'Foto del viaje')}" src="${esc(p.src)}" loading="lazy" data-action="photoOpen" data-id="${esc(p.id)}"><div class="photo-bar"><span>${esc(p.name||'Recuerdo')}</span><button class="icon-btn" data-action="photoRemove" data-id="${esc(p.id)}" aria-label="Eliminar fotografía">✕</button></div></div>`).join('')}</div>`:'<div class="empty"><div class="big">📸</div><h3>Acá van los mejores recuerdos</h3><p>Abrí la cámara del teléfono o elegí una foto guardada.</p>'+button('Añadir primera foto','photoNew')+'</div>'):noneTrip}<div class="warning" style="margin-top:16px">Las fotos se guardan de forma comprimida <strong>en este navegador</strong>. Para evitar perderlas si se borran los datos del teléfono, usá el respaldo en el menú <strong>⋯</strong>.</div>`;
    };
    const renderMap=()=>{
      const places=byTrip(data.places),friends=byTrip(data.friends).filter(f=>f.lat!=null&&f.lon!=null);
      return `${sectionHeader('Mapa del viaje','Lugares guardados y tu ubicación, con tu permiso.',button('+ Guardar lugar','placeNew'))}${trip()?`<div class="map-area"><div id="map" class="mapbox"><div class="fallback"><div class="big">🌍</div><h3>Preparando el mapa…</h3></div></div><div class="map-legend"><span><i class="dot"></i> Lugares guardados</span><span><i class="dot orange"></i> Integrantes (manual)</span><span><i class="dot blue"></i> Tu GPS (opcional)</span></div><div class="hero-action" style="margin-top:16px">${button('📍 Mostrar mi ubicación','gps','secondary')}${button('+ Agregar lugar','placeNew','ghost')}</div><div class="warning" style="margin-top:15px">Necesitás internet para cargar los mosaicos del mapa. El GPS muestra solo <strong>tu ubicación</strong>; las posiciones de amigos son ingresadas manualmente, no en tiempo real.</div><div class="section-head"><div><h2>Lugares guardados</h2><p>Coordenadas de tu itinerario.</p></div></div>${places.length?`<div class="list">${places.map(p=>`<div class="list-row"><div class="round-icon">⌖</div><div class="txt" style="flex:1"><strong>${esc(p.name)}</strong><small>${Number(p.lat).toFixed(4)}, ${Number(p.lon).toFixed(4)}</small></div><div class="list-actions"><button class="btn small-btn secondary" data-action="placeFocus" data-id="${esc(p.id)}">Ver</button><button class="icon-btn" data-action="placeRemove" data-id="${esc(p.id)}">✕</button></div></div>`).join('')}</div>`:'<div class="empty">Todavía no hay lugares guardados.</div>'}<div class="muted small" style="margin-top:14px">${friends.length} integrante(s) con coordenadas manuales.</div></div>`:noneTrip}`;
    };
    const initMap=()=>{
      const el=$('#map');if(!el)return;
      if(typeof window.L==='undefined'){el.innerHTML=`<div class="fallback"><div class="big">🗺️</div><h3>No se pudo cargar el mapa</h3><p>Comprobá tu conexión a internet. El resto de la app sigue funcionando.</p><a href="https://www.openstreetmap.org/" target="_blank" rel="noopener noreferrer">Abrir OpenStreetMap ↗</a></div>`;return;}
      try{map=L.map(el,{zoomControl:true}).setView([-31.4167,-64.1833],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
      let bounds=[];
      for(const p of byTrip(data.places)){const lat=Number(p.lat),lon=Number(p.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;bounds.push([lat,lon]);L.circleMarker([lat,lon],{radius:9,color:'#0a6259',weight:2,fillColor:'#38e5ca',fillOpacity:1}).addTo(map).bindPopup('<strong>'+esc(p.name)+'</strong><br>Lugar guardado');}
      for(const f of byTrip(data.friends)){const lat=Number(f.lat),lon=Number(f.lon);if(f.lat==null||f.lon==null||!Number.isFinite(lat)||!Number.isFinite(lon))continue;bounds.push([lat,lon]);L.circleMarker([lat,lon],{radius:8,color:'#914b1e',weight:2,fillColor:'#ffa76a',fillOpacity:1}).addTo(map).bindPopup('<strong>'+esc(f.name)+'</strong><br>Ubicación cargada manualmente');}
      if(userPos){bounds.push([userPos.lat,userPos.lon]);L.circleMarker([userPos.lat,userPos.lon],{radius:10,color:'#1a4770',weight:3,fillColor:'#4caaff',fillOpacity:1}).addTo(map).bindPopup('Tu ubicación GPS');}
      if(bounds.length===1)map.setView(bounds[0],13);else if(bounds.length>1)map.fitBounds(bounds,{padding:[28,28],maxZoom:14});setTimeout(()=>{if(map)map.invalidateSize();},150);
      }catch(e){console.error(e);el.innerHTML='<div class="fallback">No se pudo inicializar el mapa.</div>';}
    };
    const modal=(title,html)=>{$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal();};
    window.closeModal=()=>{$('#modal').close();};
    const formEnd=(text='Guardar')=>`<div class="modal-buttons"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">${text}</button></div>`;
    const input=(name,label,value='',type='text',required=true,other='')=>`<div class="field"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${other}></div>`;
    const textArea=(name,label,value='')=>`<div class="field"><label for="field-${name}">${label}</label><textarea id="field-${name}" name="${name}">${esc(value)}</textarea></div>`;
    const formModal=(title,kind,item={})=>{
      let html='';
      if(kind==='trip'){html=input('name','Nombre del viaje',item.name)+input('place','Destino',item.place||'', 'text',false)+`<div class="inline-fields">${input('start','Fecha de inicio',item.start||'','date',false)}${input('end','Fecha de regreso',item.end||'','date',false)}</div>`+textArea('description','Descripción',item.description||'');}
      if(kind==='friend'){html=input('name','Nombre del integrante',item.name)+`<div class="inline-fields">${input('lat','Latitud (opcional)',item.lat??'','number',false,'step="any" min="-90" max="90" placeholder="-31.4167"')}${input('lon','Longitud (opcional)',item.lon??'','number',false,'step="any" min="-180" max="180" placeholder="-64.1833"')}</div><div class="helper">Estos valores son manuales: no muestran GPS en vivo de tus amigos.</div>`;}
      if(kind==='event'){html=input('title','Actividad',item.title)+`<div class="inline-fields">${input('date','Fecha',item.date||'','date')}${input('time','Hora',item.time||'','time',false)}</div>`+input('place','Lugar',item.place||'','text',false)+textArea('notes','Notas',item.notes||'');}
      if(kind==='place'){html=input('name','Nombre del lugar',item.name)+`<div class="inline-fields">${input('lat','Latitud',item.lat??'','number',true,'step="any" min="-90" max="90" placeholder="-31.4167"')}${input('lon','Longitud',item.lon??'','number',true,'step="any" min="-180" max="180" placeholder="-64.1833"')}</div>`;}
      modal(title,`<form id="entityForm">${html}${formEnd()}</form>`);
      $('#entityForm').addEventListener('submit',e=>{e.preventDefault();const entries=Object.fromEntries(new FormData(e.target));
        for(const k of Object.keys(entries))entries[k]=String(entries[k]).trim();
        if(kind==='trip'&&entries.start&&entries.end&&entries.end<entries.start){alertToast('La fecha de regreso debe ser posterior al inicio');return;}
        if(kind==='friend'&&(entries.lat!==''||entries.lon!=='')){if(entries.lat===''||entries.lon===''){alertToast('Completá ambas coordenadas o ninguna');return;}}
        if(kind==='place'||(kind==='friend'&&entries.lat!=='')){entries.lat=Number(entries.lat);entries.lon=Number(entries.lon);if(!Number.isFinite(entries.lat)||!Number.isFinite(entries.lon)||Math.abs(entries.lat)>90||Math.abs(entries.lon)>180){alertToast('Coordenadas inválidas');return;}}
        else if(kind==='friend'){entries.lat=null;entries.lon=null;}
        const list={trip:'trips',friend:'friends',event:'activities',place:'places'}[kind];
        if(item.id){const old=data[list].find(x=>x.id===item.id);if(!old)return;Object.assign(old,entries);}else{const newItem={...entries,id:id()};if(kind!=='trip')newItem.tripId=trip().id;data[list].push(newItem);if(kind==='trip'){data.activeTrip=newItem.id;data.demo=false;}}
        if(persist()){closeModal();render();alertToast(item.id?'Cambios guardados':'Guardado correctamente');}
      });
    };
    const confirmRemove=(message,fn)=>{if(window.confirm(message)){fn();persist();render();alertToast('Eliminado');}};
    const handleAction=(action,elem)=>{
      const itemId=elem.dataset.id,t=trip();
      if(['tripNew','tripEdit','friendNew','friendEdit','eventNew','eventEdit','placeNew'].includes(action)){
        if(!t&&!['tripNew'].includes(action)){alertToast('Primero creá un viaje');return;}
        const dict={tripNew:['Nuevo viaje','trip'],tripEdit:['Editar viaje','trip'],friendNew:['Agregar integrante','friend'],friendEdit:['Editar integrante','friend'],eventNew:['Nueva actividad','event'],eventEdit:['Editar actividad','event'],placeNew:['Guardar lugar','place']};const [title,kind]=dict[action];
        const existing={trip:t,friend:data.friends.find(x=>x.id===itemId),event:data.activities.find(x=>x.id===itemId)};
        formModal(title,kind,action.endsWith('Edit')?existing[kind]:{});return;
      }
      if(action==='tripSelect'){if(data.trips.some(x=>x.id===itemId)){data.activeTrip=itemId;persist();render();alertToast('Viaje seleccionado');}return;}
      if(action==='tripRemove'&&t){confirmRemove(`¿Eliminar “${t.name}” y todos sus datos locales?`,()=>{for(const k of ['friends','activities','places','photos'])data[k]=data[k].filter(x=>x.tripId!==t.id);data.trips=data.trips.filter(x=>x.id!==t.id);data.activeTrip=data.trips[0]?.id||null;});return;}
      const removal={friendRemove:'friends',eventRemove:'activities',placeRemove:'places',photoRemove:'photos'};
      if(removal[action]){confirmRemove('¿Eliminar este elemento?',()=>{data[removal[action]]=data[removal[action]].filter(x=>x.id!==itemId);});return;}
      if(action==='placeFocus'){const p=data.places.find(x=>x.id===itemId);if(p&&map){map.setView([p.lat,p.lon],15);window.scrollTo({top:0,behavior:'smooth'});}return;}
      if(action==='gps'){
        if(!navigator.geolocation){alertToast('Este navegador no admite GPS');return;}
        alertToast('Solicitando permiso de ubicación…');navigator.geolocation.getCurrentPosition(pos=>{userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};if(map){map.remove();map=null;}render();alertToast('Ubicación mostrada solo en este dispositivo');},err=>alertToast(err.code===1?'Permiso de ubicación denegado':'No se pudo obtener tu ubicación'),{enableHighAccuracy:true,timeout:12000,maximumAge:0});return;
      }
      if(action==='photoNew'){if(!t){alertToast('Primero creá un viaje');return;}$('#photoInput').click();return;}
      if(action==='photoOpen'){const p=data.photos.find(x=>x.id===itemId);if(p)modal(esc(p.name||'Recuerdo'),`<img class="photo-large" src="${esc(p.src)}" alt="Foto del viaje"><div style="margin-top:12px;text-align:right"><a class="btn secondary" href="${esc(p.src)}" download="recuerdo-viaje.jpg">Guardar imagen</a></div>`);return;}
      if(action==='export')exportData();
      if(action==='import')$('#importInput').click();
      if(action==='reset')confirmRemove('¿Borrar todos los viajes y fotos guardados en este navegador? Esta acción no se puede deshacer.',()=>{data={demo:false,trips:[],activeTrip:null,friends:[],activities:[],places:[],photos:[]};closeModal();});
    };
    document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){changePage(navEl.dataset.nav);return;}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action);});
    $('#dataBtn').addEventListener('click',()=>modal('Tus datos locales',`<p class="helper">Los datos se guardan solamente en este navegador y dispositivo. No se comparten con otros celulares.</p><div class="list"><button class="btn secondary full" data-action="export">${icon('download')} Descargar respaldo (.json)</button><button class="btn secondary full" data-action="import">📂 Importar respaldo</button><button class="btn danger full" data-action="reset">Borrar todos los datos</button></div><div class="warning" style="margin-top:15px">Si borrás los datos del navegador, se perderá lo guardado, salvo que hayas descargado un respaldo. El respaldo contiene también tus fotografías.</div>`));
    const exportData=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ViajeAmigosPro_respaldo.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alertToast('Respaldo descargado');};
    $('#importInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=clean(JSON.parse(await file.text()));if(!window.confirm('¿Reemplazar los datos actuales por los del respaldo?'))return;const previous=data;data=parsed;if(!persist()){data=previous;return;}closeModal();render();alertToast('Respaldo importado');}catch(err){alertToast('No se pudo importar el respaldo');}finally{e.target.value='';}});
    const resize=async file=>{const bitmap=await createImageBitmap(file);let w=bitmap.width,h=bitmap.height;const max=880,s=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const cvs=document.createElement('canvas');cvs.width=w;cvs.height=h;cvs.getContext('2d').drawImage(bitmap,0,0,w,h);bitmap.close();return cvs.toDataURL('image/jpeg',.66);};
    $('#photoInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(!f.type.startsWith('image/'))throw Error('Elegí una imagen');if(!trip())throw Error('Primero creá un viaje');const src=await resize(f);const item={id:id(),tripId:trip().id,name:(f.name||'Foto del viaje').replace(/\.[^.]+$/,'').slice(0,40),date:new Date().toISOString(),src};data.photos.push(item);if(!persist()){data.photos.pop();}else{render();alertToast('Foto guardada');}}catch(err){alertToast('No se pudo agregar esa fotografía');}finally{e.target.value='';}});
    if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  })();
  </script>
</body>
</html>
